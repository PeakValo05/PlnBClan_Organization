<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="/css/index.css">
    <title>Index</title>
</head>
<body>


    <!-- Top Bar -->
    <div class="top-bar w-100 d-flex justify-content-center" style=" background-color: #07111F; height: 90px;">
        <img src="/images/PlnB logo.png" alt="PlnB Logo" style="width: 100px; height: auto;">
        <div class="top-bar-content d-flex align-items-center justify-content-flex-end" style="flex: 1;">
            
            <!-- Join Button -->
<a href="https://discord.gg/akzxgu8fd"
   target="_blank"
   rel="noopener noreferrer"
   style="
       color: white;
       text-decoration: none;
       font-size: 16px;
       
      
       border-radius: 5px;
       font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
       font-weight: bold;
   ">
   
    
            <img src="/images/discord-icon.png" alt="Discord Icon" class="discord-icon">
  
</a>

        </div>
        
    </div>

<div class="container py-5">

    <div class="row justify-content-center">
        
        <div class="col-11 col-sm-10 col-md-8 col-lg-6 col-xl-5">
    <!-- Logo Section -->
<div class="logo-container d-flex w-100 justify-content-center">
    <img src="/images/PlnB logo.png"
         alt="PlnB Logo"
         class="mx-auto d-block w-75"
         >
            </div>
        </div>
    </div>
</div>


<div class="container py-4">

    <div class="row justify-content-center">

        <!--
            col-11    = almost full width on phones
            col-sm-10 = 10/12 width on small screens
            col-md-8  = 8/12 width on tablets
            col-lg-6  = 6/12 width on desktop
            col-xl-5  = 5/12 width on large screens
        -->
        <div class="col-11 col-sm-10 col-md-8 col-lg-6 col-xl-5">

            <!--
                d-flex flex-column = stack elements vertically
                gap-3              = space between elements
                p-3 p-md-4         = responsive padding
                rounded-4          = rounded corners
            -->
            <div class="content-container d-flex flex-column gap-3 p-3 p-md-4 rounded-4" style="background-color: #07111F;">
`
                <!-- Heading -->
                <h1 class="text-center text-white mb-0">
                    Get In Touch
                </h1>

                <!-- Description -->
                <p class="text-center text-white small mb-2">
                    We would love to hear from you!
                    <br>
                    Please enter your message below and we will get back to you as soon as possible.
                </p>

                <!-- Roblox Username -->
                <input
                    type="text"
                    class="form-control"
                    placeholder="Enter Your Roblox Username">

                <!-- Discord Username -->
                <input
                    type="text"
                    class="form-control"
                    placeholder="Enter Your Discord Username">

                <!-- Inquiry Type -->
                <select class="form-select">
                    <option value="general">General Inquiry</option>
                    <option value="support">Support</option>
                    <option value="feedback">Feedback</option>
                    <option value="other">Other</option>
                </select>

                <!-- Message -->
                <textarea
                    class="form-control"
                    rows="4"
                    placeholder="Enter Your Message"></textarea>

                <!-- Submit Button -->
                <input
                    type="submit"
                    value="Submit"
                    class="btn btn-outline-light w-100">

            </div>

        </div>

    </div>

</div>
    





    


</body>
</html>
