<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="/css/clan-players.css">
    <title>Clan Members</title>
</head>
<body>

<!-- PAGE CONTENT: INCLUDES CLAN MEMBERS AND DIAMONDS  -->
<div class="container-fluid py-4">

    <div class="row justify-content-between gap-2 flex-wrap mt-4 mx-auto" style="max-width: 1200px;">

        <!-- LEFT CARD -->
        <div class="col-12 col-md-6 col-lg-5" style="flex: 1 1 45%;">
            <div class="p-3 d-flex flex-column align-items-center"
                 style="
                    background-color: #07111F;
                    height: 700px;
                    overflow-y: auto;
                    border-radius: 20px;
                 ">

                <h2 class="text-center text-white fs-4">
                    Clan Members
                </h2>

                <hr class="text-white w-50">

                <div class="w-100 px-3">

                    <div th:each="player : ${players}"
                         class="mb-3 text-center">

                        <h5 class="text-white mb-0"
                            th:text="${player.displayName}">
                            Display Name
                        </h5>

                        <p class="text-secondary mb-0">
                            @<span th:text="${player.username}">
                                username
                            </span>
                        </p>

                    </div>

                </div>

            </div>
        </div>


        <!-- RIGHT CARD -->
        <div class="col-12 col-md-6 col-lg-5" style="flex: 1 1 45%;">
            <div class="p-3 d-flex flex-column align-items-center"
                 style="
                    background-color: #07111F;
                    height: 700px;
                    overflow-y: auto;
                    border-radius: 20px;
                 ">

                <h2 class="text-center text-white fs-4">
                    Diamonds
                </h2>

                <hr class="text-white w-50">
                 <div class="w-100 px-3">

                    <div th:each="player : ${players}"

                         class="mb-3 text-center">
                        
                            <h5 class="text-white mb-0" th:text="${player.displayName}">
                                Player Name
                            </h5>

                        
                           <span th:text="${player.diamonds} + ' Diamonds'" class="text-white" style="letter-spacing: 2px">
                                0
                            </span>

                    </div>
                 </div>
            </div>
        </div>

    </div>

</div>
</div>
<!-- FOOTER: HOME BTN, DISCORD LINK, AND LOGO -->
<div class="container-fluid py-3 position-fixed bottom-0"
     style="background-color: #07111F; z-index: 1000;">

    <div class="row align-items-center">

        <!-- LEFT SIDE -->
        <div class="col d-flex align-items-center gap-2">

            <a href="/">
                <img src="/images/home-icon.png"
                     alt="Home"
                     class="home-icon img-fluid"
                     width="50">
            </a>

            <a href="https://discord.gg/akzxgu8fd"
               target="_blank"
               rel="noopener noreferrer">

                <img src="/images/discord-icon.png"
                     alt="Discord"
                     class="discord-icon img-fluid"
                     width="50">

            </a>

        </div>

        <!-- RIGHT SIDE -->
        <div class="col d-flex justify-content-end">

            <img src="/images/plnb-logo.png"
                 alt="PlnB Logo"
                 class="img-fluid"
                 width="100">

        </div>

    </div>

</div>

</body>
</html>
