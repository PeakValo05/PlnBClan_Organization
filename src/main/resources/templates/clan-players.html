<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet">
<!-- Bootstrap JS and Google Fonts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>


    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet">

<link rel="stylesheet" href="/css/clan-players.css">
<link rel="stylesheet" href="/css/fonts.css">
    <title>Clan Members</title>
</head>
<body>


    <!-- HEADER SECTION -->
<div class="container-fluid mt-4">
    <div class="row justify-content-center">
        <div class="col-12 col-md-12 col-lg-8">
            
            
            <!-- HEADER SECTION -->
            <div class="d-flex flex-column flex-md-row align-items-center justify-content-start text-light p-3 p-md-4"
                 style="
                    background-color: #07111F;
                    min-height: 200px;
                    box-shadow:
                        0 0 12px rgba(0, 174, 255, 0.45),
                        0 0 30px rgba(0, 110, 255, 0.20); border-radius: 20px;
                 ">

            <!-- IMAGE SECTION: INCLUDES ORGANIZATION LOGO -->
            <div class="img-fluid col-6 col-md-4 col-lg-3 mb-3 justify-content-center d-flex align-items-center" 
                        style="height: 200px; margin-top: 15px; background-color: #03152c; box-shadow: 0 0 12px rgba(20, 160, 224, 0.45), 0 0 30px rgba(33, 89, 161, 0.5);">
                <img src="/images/plnb-logo.png"
                     alt="PlnB Logo"
                     class="img-fluid mb-3 mb-md-0"
                     style="max-width: 200px;">
            </div>

            <!-- TEXT SECTION: INCLUDES ORGANIZATION NAME AND SLOGAN -->
            <div class="d-flex flex-column " style="width: 100%; ">
                <p class="fw-bold text-md-start ms-3 mb-auto me-auto ms-auto"
                   style="
                        font-family: 'Luckiest Guy', sans-serif;
                        font-size: clamp(28px, 4vw, 65px);
                    letter-spacing: 3px;" >
                    PlnB Organization
                </p>
                <P class="text-center text-md-start ms-3 mb-auto ms-auto me-auto" 
                                style="font-family: 'Luckiest Guy', sans-serif; font-size: clamp(16px, 2vw, 20px); 
                                letter-spacing: 6px; color: #67DDFF;">Together We Hatch Bigger</P>


                <!-- DIVIDER -->
                <hr class="text-white p-3 ms-4" style="max-width: 1200px;">

                <!-- MEMBERS ICON SECTION -->
        <div class="d-flex flex-row align-items-start mb-3">


            <!-- Members Section -->
            <div class="d-flex flex-column flex-md-row justify-content-center align-items-center gap-3 w-100 mb-3">
            <!-- MEMBERS ICON -->
                <img src="/images/members-icon.png"
                     alt="PlnB Banner"
                     class="img-fluid mb-2 ms-2"
                     style="max-width: 60px;">

                     <p class="mb-0">
                        <span th:text="${currentPlayers} + ' / ' + ${maxPlayers} + ' Members'" class="fw-bold"></span>
                     </p>
                </div>

         
            <hr class="text-white" style="width: 20%; transform: rotate(90deg);">


            <!-- Diamonds deposited -->
            <div class="d-flex flex-column flex-md-row justify-content-center align-items-center gap-3 w-100 mb-3">
            <img src="/images/diamond-icon.png"
                 alt="Diamonds Icon"
                 class="img-fluid mb-3 ms-4"
                 style="max-width: 60px;">
                 <p class="mb-0">
                    <span th:text="${#numbers.formatInteger(currentDiamonds, 1, 'COMMA')} + ' Diamonds'" class="fw-bold"></span>
                 </p>
            </div>


            <hr class="text-white" style="width: 20%; transform: rotate(90deg);">


            <!-- Clan Level -->
<div class="d-flex flex-column flex-md-row justify-content-center align-items-center gap-3 w-100 mb-3">
    <img src="/images/crown-icon.png"
         alt="Crown Icon"
         class="img-fluid mb-3"
         style="max-width: 50px;">

    <p class="mb-0">
        <span th:text="'Clan Level ' + ${guildLevel}" class="fw-bold"></span>
    </p>
</div>
            </div>
            

                </div>
            </div>

        </div>
    </div>
</div>

        

    

<!-- PAGE CONTENT: INCLUDES CLAN MEMBERS AND DIAMONDS  -->
<div class="container-fluid py-4">

    <div class="row justify-content-between gap-2 flex-wrap mt-4 mx-auto" style="max-width: 1200px;">
        


        <div class="col-12 col-md-6 col-lg-5 mt-5" style="flex: 1 1 45%;">
            <div class="p-3 d-flex flex-column align-items-center" 
                 style="
                        background-color: #07111F; 
                        height: 700px; 
                        overflow-y: auto; 
                        border-radius: 20px;
                        box-shadow: 0 0 12px rgba(0, 174, 255, 0.45), 0 0 30px rgba(0, 110, 255, 0.20);">
                <h2 class="text-center text-white fs-4">
                    Leaders
                </h2>
                <hr class="text-white w-50">
                <div class="w-100 px-3">

                 
                    <div th:each="leader : ${leaders}" class="leader-card mb-3 text-center accordion-flush 
                                flex-column align-items-center border rounded p-3" 
                                
                                style="background-color: #0A1A2F;">

                        <h5 class="text-white mb-0"
                            th:text="${leader.displayName}">
                            Display Name
                        </h5>


                        <p class="text-secondary mb-0">
                            @<span th:text="${leader.username}">
                                username
                            </span>
                        </p>

                    </div>

                </div>
            </div>
        </div>



        <!-- CLAN MEMBERS CARD -->
        <div class="col-12 col-md-6 col-lg-5 mt-5" style="flex: 1 1 45%;">
            <div class="p-3 d-flex flex-column align-items-center"
                 style="
                    background-color: #07111F;
                    height: 700px;
                    overflow-y: auto;
                    border-radius: 20px;
                    box-shadow: 0 0 12px rgba(0, 174, 255, 0.45), 0 0 30px rgba(0, 110, 255, 0.20);
                 ">

                <h2 class="text-center text-white fs-4">
                    Clan Members
                </h2>

                <hr class="text-white w-50">

                <div class="w-100 px-3">

                    <div th:each="member : ${members}" class="member-card mb-3 d-flex text-center flex-column align-items-center border rounded p-3" 
                         style="background-color: #0A1A2F;">
                                                                            

                        <h5 class="text-white mb-0"
                            th:text="${member.displayName}">
                            Display Name
                        </h5>

                        <p class="text-secondary mb-0">
                            @<span th:text="${member.username}">
                                username
                            </span>
                            
                        </p>

                        <span th:text="${member.diamonds} + ' Diamonds'" class="text-white"></span>

                    </div>

                </div>

            </div>
        </div>
   

                    </div>
                 </div>
            </div>
        </div>

    </div>

</div>
</div>
<!-- FOOTER: HOME BTN, DISCORD LINK, AND LOGO -->
<div class="container-fluid py-3 position-absolute mt-auto"
     style="background-color: #07111F; z-index: 1000;">

    <div class="row align-items-center">

        <!-- LEFT SIDE -->
        <div class="col-6 d-flex align-items-center gap-2">

            <a href="/">
                <img src="/images/home-nav.png"
                     alt="Home"
                     class="home-icon img-fluid"
                     width="80">
            </a>

            <a href="https://discord.gg/akzxgu8fd"
               target="_blank"
               rel="noopener noreferrer">

                <img src="/images/discord-nav.png"
                     alt="Discord"
                     class="discord-icon img-fluid"
                     width="100">

            </a>

        </div>

<!-- RIGHT SIDE -->
<div class="col-4 col-md-3 col-lg-1 d-flex ms-auto align-items-center">

    <img src="/images/plnb-logo.png"
         alt="PlnB Logo"
         class="img-fluid footer-logo">

</div>

    </div>

</div>

</body>
</html>
